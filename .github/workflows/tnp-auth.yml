name: TECH na PESA Google and Facebook sign in
# Switches on "Continue with Google" and "Continue with Facebook" on technapesa.co.ke once the owner has added the keys
# as repository secrets. Keys are passed to Supabase Auth only and never printed. A provider without keys stays off.
# Secrets used: SUPABASE_ACCESS_TOKEN, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, FACEBOOK_APP_ID, FACEBOOK_APP_SECRET.
on:
  workflow_dispatch:
  push: { branches: [main], paths: ['.github/workflows/tnp-auth.yml'] }
concurrency: { group: tnp-auth, cancel-in-progress: false }
env:
  PROJECT_REF: kbaetbnzurntvhcqzihc
jobs:
  providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Switch on the providers that have keys
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
        run: |
          set -euo pipefail
          G=false; F=false
          body='{}'
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            G=true; body=$(jq -n --argjson b "$body" --arg i "$GOOGLE_CLIENT_ID" --arg s "$GOOGLE_CLIENT_SECRET" '$b + {external_google_enabled: true, external_google_client_id: $i, external_google_secret: $s}')
          fi
          if [ -n "$FACEBOOK_APP_ID" ] && [ -n "$FACEBOOK_APP_SECRET" ]; then
            F=true; body=$(jq -n --argjson b "$body" --arg i "$FACEBOOK_APP_ID" --arg s "$FACEBOOK_APP_SECRET" '$b + {external_facebook_enabled: true, external_facebook_client_id: $i, external_facebook_secret: $s}')
          fi
          if [ "$G" = false ] && [ "$F" = false ]; then echo "No Google or Facebook keys added yet; the buttons stay hidden."; exit 0; fi
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "content-type: application/json" --data-binary "$body")
          if [ "$code" -ge 300 ]; then echo "Supabase refused the settings (HTTP $code)"; jq -r '.message // .error // "no message"' /tmp/r.json 2>/dev/null | head -c 300; exit 1; fi
          echo "Supabase sign in updated: Google=$G Facebook=$F"
          q=$(jq -n --arg sql "update public.site_settings set value = jsonb_build_object('google', $G, 'facebook', $F), updated_at = now() where key = 'auth.social'" '{query: $sql}')
          curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "content-type: application/json" -d "$q" >/dev/null
          echo "Buttons on the site: Google=$G Facebook=$F"
