name: Opportunity Desk check
# A hand check of the Opportunity Desk: prints to the run's log, sends nothing to Telegram and saves nothing.
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'probe = test the sources only; dry = the whole morning search, printed', default: 'dry' }
concurrency: { group: oppdesk-check, cancel-in-progress: true }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Open the private store
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${VAULT_TOKEN}@github.com/timsauti/timsauti-agent.git" vault
          for p in data photos agent/assets/people agent/assets/cornerstone oppdesk/profile.json agent/makasa_style.txt; do rm -rf "$p"; ln -s "$PWD/vault/$p" "$p"; done
          mkdir -p vault/data/logs
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node oppdesk/test.js > /dev/null
      - run: node oppdesk/run.js "$MODE" > vault/data/logs/oppdesk-check.log 2>&1
        env:
          MODE: ${{ github.event.inputs.mode || 'dry' }}
          DRAFT_FIRST: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_OPPDESK_KEY: ${{ secrets.GEMINI_OPPDESK_KEY }}
          GEMINI_BETDESK_KEY: ${{ secrets.GEMINI_BETDESK_KEY }}
      - name: Keep the result in the private store
        if: always()
        run: |
          cd vault
          git config user.name "timsauti-agent"; git config user.email "agent@users.noreply.github.com"
          git add -A data/logs; git diff --cached --quiet && exit 0; git commit -q -m "Opportunity Desk check"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done; exit 1
