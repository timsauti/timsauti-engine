name: TECH na PESA grant first administrator
# Run once by hand, right after the owner signs up: gives the administrator role to the ONLY account on the platform
# and records it in the audit log. No email is passed in, because this repository and its run logs are public.
# It refuses if there is more than one account, or if an administrator already exists.
on:
  workflow_dispatch:
    inputs:
      confirm: { description: 'Type GRANT to make the only account the administrator', required: true }
env:
  PROJECT_REF: kbaetbnzurntvhcqzihc
jobs:
  grant:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Grant the administrator role
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          if os.environ['CONFIRM'].strip() != 'GRANT': raise SystemExit('type GRANT to confirm')
          sql = f"""with u as (select id from auth.users where (select count(*) from auth.users) = 1
                       and not exists (select 1 from public.user_roles where role = 'administrator'))
          , g as (insert into public.user_roles (user_id, role) select id, 'administrator' from u on conflict do nothing returning user_id)
          insert into public.audit_log (actor_kind, action, entity, entity_id, after, note)
          select 'service', 'role.granted', 'user_role', id::text, '{{"role":"administrator"}}'::jsonb, 'first administrator, granted by the owner through GitHub' from u
          returning entity_id"""
          req = urllib.request.Request(f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/query", data=json.dumps({'query': sql}).encode(),
                headers={'Authorization': 'Bearer ' + os.environ['SUPABASE_ACCESS_TOKEN'], 'Content-Type': 'application/json'}, method='POST')
          rows = json.loads(urllib.request.urlopen(req).read())
          print('administrator granted' if rows else 'refused: needs exactly one account and no administrator yet')
          if not rows: raise SystemExit(1)
          PY
