name: TECH na PESA server functions
# Deploys the Supabase Edge Functions in technapesa-db/supabase/functions (Paystack payments) to the live project
# and passes the Paystack secret key from this repository's secrets to Supabase. The key is never printed.
# Secrets used: SUPABASE_ACCESS_TOKEN, PAYSTACK_SECRET_KEY (added by the owner).
on:
  push: { branches: [main], paths: ['technapesa-db/supabase/functions/**', '.github/workflows/tnp-functions.yml'] }
  workflow_dispatch:
concurrency: { group: tnp-functions, cancel-in-progress: false }
env:
  PROJECT_REF: kbaetbnzurntvhcqzihc
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults: { run: { working-directory: technapesa-db } }
    steps:
      - uses: actions/checkout@v4
      - name: Set function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
        run: |
          if [ -n "$PAYSTACK_SECRET_KEY" ]; then
            npx -y supabase@2.122.0 secrets set --project-ref "$PROJECT_REF" PAYSTACK_SECRET_KEY="$PAYSTACK_SECRET_KEY" SITE_URL=https://technapesa.co.ke >/dev/null
            echo "Paystack key set ($(echo "$PAYSTACK_SECRET_KEY" | cut -c1-8)...)"
            curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "content-type: application/json" \
              -d '{"query":"update public.site_settings set value = to_jsonb($$automatic$$::text), updated_at = now() where key = $$payments.mode$$"}' >/dev/null && echo "Site switched to the M-PESA prompt"
          else
            echo "PAYSTACK_SECRET_KEY is not set in this repository yet; payments stay switched off"
          fi
      - name: Deploy functions
        env: { SUPABASE_ACCESS_TOKEN: '${{ secrets.SUPABASE_ACCESS_TOKEN }}' }
        run: |
          npx -y supabase@2.122.0 functions deploy paystack-init --project-ref "$PROJECT_REF" --use-api
          npx -y supabase@2.122.0 functions deploy paystack-verify --project-ref "$PROJECT_REF" --use-api
          npx -y supabase@2.122.0 functions deploy paystack-mpesa --project-ref "$PROJECT_REF" --use-api
          npx -y supabase@2.122.0 functions deploy paystack-webhook --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
