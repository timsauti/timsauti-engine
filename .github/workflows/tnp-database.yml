name: TECH na PESA database
# Runs here (public repository, free build minutes) on the public copy in technapesa-db/.
# Tests every migration on a throwaway database, then applies new migrations to staging.
# Secrets in this repository: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, VAULT_TOKEN.
# Before any new migration is applied, a full backup goes to the private vault.
on:
  push: { branches: [main], paths: ['technapesa-db/**', '.github/workflows/tnp-database.yml'] }
  workflow_dispatch:
concurrency: { group: tnp-database, cancel-in-progress: false }
env:
  PROJECT_REF: kbaetbnzurntvhcqzihc   # technapesa-staging (not a secret: it appears in the public site address)
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16 with PostGIS
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-16 postgresql-16-postgis-3 >/dev/null
      - name: Run migrations and database tests on a throwaway database
        working-directory: technapesa-db
        run: bash scripts/test-db.sh
  apply:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Open the private vault
        env: { VAULT_TOKEN: '${{ secrets.VAULT_TOKEN }}' }
        run: git clone -q --depth 1 "https://x-access-token:${VAULT_TOKEN}@github.com/timsauti/timsauti-agent.git" vault
      - name: Back up, then apply new migrations to staging
        working-directory: technapesa-db
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VAULT_DIR: ${{ github.workspace }}/vault
        run: |
          npx -y supabase@2.122.0 link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          bash scripts/backup.sh before-migration
          ( cd "$VAULT_DIR" && git config user.name "timsauti-agent" && git config user.email "agent@users.noreply.github.com" \
            && git add -A technapesa && git commit -q -m "TECH na PESA backup before migration" \
            && for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done; exit 1 )
          npx -y supabase@2.122.0 db push -p "$SUPABASE_DB_PASSWORD" --include-all
      - name: Point sign in links at the site (technapesa.co.ke, with technapesa.pages.dev kept as a fallback)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SITE: ${{ vars.TNP_SITE_URL || 'https://technapesa.co.ke' }}
          OLD: https://technapesa.pages.dev
          # true lets new readers sign in straight away while the site has no email sender; set the variable TNP_AUTOCONFIRM to false once Resend is connected
          AUTOCONFIRM: ${{ vars.TNP_AUTOCONFIRM || 'true' }}
        run: |
          ALLOW="$SITE/auth/callback/,$SITE/reset/,https://www.technapesa.co.ke/auth/callback/,https://www.technapesa.co.ke/reset/,$OLD/auth/callback/,$OLD/reset/,http://localhost:4321/auth/callback/,http://localhost:4321/reset/"
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"site_url\":\"$SITE\",\"uri_allow_list\":\"$ALLOW\",\"mailer_autoconfirm\":$AUTOCONFIRM,\"mailer_otp_exp\":3600,\"password_min_length\":10,\"security_update_password_require_reauthentication\":true}" >/dev/null
          echo "auth settings updated for $SITE"
