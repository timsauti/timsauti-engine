name: Quick news check
on:
  schedule:
    - cron: '7 3-6,8-11,13-15,17-19 * * *'   # hourly quick check, 6am to 10pm Nairobi time, between the full runs; each run books news ahead so stories keep flowing
  workflow_dispatch: {}
concurrency:
  group: agent
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Open the private store
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${VAULT_TOKEN}@github.com/timsauti/timsauti-agent.git" vault
          for p in data photos agent/assets/people agent/assets/cornerstone oppdesk/profile.json agent/makasa_style.txt; do rm -rf "$p"; ln -s "$PWD/vault/$p" "$p"; done
          mkdir -p vault/data/logs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/cache@v4
        id: nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund
      - name: Self check
        run: node tools/selftest.js
      - name: Tell the owner the self check failed
        if: failure()
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OW: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG/sendMessage" --data-urlencode "chat_id=$OW" --data-urlencode "text=AGENT ALERT: the agent's self check failed, so this run was stopped before posting anything. Claude needs to fix the code."
      - name: Quick check
        env:
          TIMSAUTI_PAGE_TOKEN: ${{ secrets.TIMSAUTI_PAGE_TOKEN }}
          MAKASA_PAGE_TOKEN: ${{ secrets.MAKASA_PAGE_TOKEN }}
          SAUTI_PAGE_TOKEN: ${{ secrets.SAUTI_PAGE_TOKEN }}
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_OPPDESK_KEY: ${{ secrets.GEMINI_OPPDESK_KEY }}
          GEMINI_BETDESK_KEY: ${{ secrets.GEMINI_BETDESK_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          FAST: '1'
        run: node agent/run.js > vault/data/logs/news.log 2>&1
      - name: Save the agent's records
        if: always()
        run: |
          cd vault
          git config user.name "timsauti-agent"
          git config user.email "agent@users.noreply.github.com"
          git add -A data photos agent/assets/people agent/assets/cornerstone oppdesk/profile.json agent/makasa_style.txt
          git diff --cached --quiet || git commit -q -m "Quick news check $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs --autostash && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*5)); done; exit 1
